name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      # External services are mocked in tests; this only needs to be a valid URL.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://test:test@localhost:5432/test' }}
      JWT_SECRET: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: jest
        continue-on-error: true
        run: npm test -- --ci --coverage --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary --json --outputFile=test-results.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            test-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Annotate failures and write summary
        if: always()
        run: node .github/scripts/test-report.mjs

      - name: Fail if tests failed
        if: steps.jest.outcome != 'success'
        run: exit 1
