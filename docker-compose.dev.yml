# Development: app + Neon Local (ephemeral branch of your Neon project).
# Run with:  docker compose --env-file .env.development -f docker-compose.dev.yml up --build
name: acquisitions-dev

services:
  neon-local:
    image: neondatabase/neon_local:latest
    ports:
      - '5432:5432'
    env_file:
      - .env.development
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5432']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: development
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    environment:
      # Inside the compose network, Neon Local is reachable by service name
      # (overrides the localhost values in .env.development).
      DATABASE_URL: postgres://neon:npg@neon-local:5432/neondb
      NEON_LOCAL_ENDPOINT: http://neon-local:5432/sql
    depends_on:
      neon-local:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
      - ./logs:/app/logs
